server {
    listen 3000;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    location / {
        # This is the key line for SPAs: tries the file/directory, then falls back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (service name "backend" in docker-compose.yaml).
    # The React app calls "/api/..." expecting this reverse proxy (same role the Ingress plays in k8s).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}