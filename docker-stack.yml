version: "3.8"

services:
  frontend:
    # Swarm does not build. Point this at an image you built and pushed.
    image: ${REGISTRY:-localhost:5000}/todo-frontend:latest
    ports:
      - "8080:3000"          # host 8080 -> nginx 3000 (3000 is taken by monitoring_grafana on the mesh)
    networks:
      - frontend-net          # edge tier (published via ingress; carries no internal traffic)
      - backend-net           # reaches backend as "backend"
    # Wait until the backend answers before starting nginx (frontend starts last).
    command:
      - sh
      - -c
      - |
        until wget -q -T 2 -O /dev/null http://backend:5000/api/todos; do
          echo "waiting for backend:5000..."; sleep 2;
        done
        exec nginx -g 'daemon off;'
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

  backend:
    image: ${REGISTRY:-localhost:5000}/todo-backend:latest
    env_file:
      - ./backend/.env
    networks:
      - backend-net           # reachable from frontend as "backend"
      - db-net                # reaches db as "db"
    # Wait until MongoDB accepts TCP connections before starting the API (db starts first).
    command:
      - sh
      - -c
      - |
        until node -e 'const s=require("net").connect(27017,"db");s.setTimeout(2000);s.on("connect",()=>process.exit(0));s.on("timeout",()=>process.exit(1));s.on("error",()=>process.exit(1));' 2>/dev/null; do
          echo "waiting for db:27017..."; sleep 2;
        done
        exec node server.js
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
    # No published port: nginx reaches it over frontend-net.

  db:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - db-net                # only shares a net with backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager   # keep the local volume pinned to one node
      restart_policy:
        condition: on-failure
    # No published port. db-net is internal, so db has no route in or out.

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
    internal: true            # backend tier has no egress either; only frontend-net has a gateway
  db-net:
    driver: overlay
    internal: true            # no external gateway -> db is not internet-exposed

volumes:
  mongo-data:
